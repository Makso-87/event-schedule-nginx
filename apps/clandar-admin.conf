server {
    listen 80;
    server_name calendar-admin.afisha-hk.ru;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name calendar-admin.afisha-hk.ru;

    ssl_certificate /etc/nginx/ssl/calendar-admin/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/calendar-admin/privkey.pem;

    location / {
        proxy_pass http://calendar-admin:1008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://calendar-service:16108/api;
        proxy_method $request_method;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}